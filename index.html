<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex">
<title>キッズPOS</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{--qr:28mm;--main:#2b6cb0;--bg:#f7f9fc}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Hiragino Sans",sans-serif;background:var(--bg);color:#222;font-size:16px}
header{background:var(--main);color:#fff;padding:10px 12px}
header h1{margin:0;font-size:18px}
nav{display:flex;gap:6px;padding:8px;background:#fff;position:sticky;top:0;z-index:10;overflow-x:auto;border-bottom:1px solid #ddd}
nav button{flex:0 0 auto;font-size:15px;padding:8px 12px;border:1px solid #cbd5e0;background:#fff;border-radius:20px}
nav button.on{background:var(--main);color:#fff;border-color:var(--main)}
main{padding:12px;max-width:760px;margin:0 auto}
section{display:none}section.on{display:block}
h2{font-size:17px;margin:4px 0 10px}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
label{display:block;font-size:14px;margin:8px 0 4px;color:#444}
input[type=text],input[type=number],select{width:100%;font-size:17px;padding:10px;border:1px solid #cbd5e0;border-radius:8px;background:#fff}
button.btn{font-size:17px;padding:12px 16px;border-radius:10px;border:none;background:var(--main);color:#fff;margin:6px 6px 0 0}
button.sub{background:#e2e8f0;color:#222}
button.warn{background:#c53030}
button.mini{font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid #cbd5e0;background:#fff;margin-left:4px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{border-bottom:1px solid #e2e8f0;padding:8px 4px;text-align:left}
td.num,th.num{text-align:right}
video{width:100%;max-width:480px;background:#000;border-radius:10px;display:block}
#scanmsg{font-size:15px;margin-top:6px;min-height:1.5em}
.total{font-size:26px;font-weight:bold;text-align:right}
.thumb svg{width:64px;height:64px;display:block}
.hint{font-size:13px;color:#666}
.err{color:#c53030;font-weight:bold}
.ok{color:#2f855a;font-weight:bold}
.sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm}
.cell{border:1px dashed #bbb;border-radius:4px;padding:3mm;text-align:center;break-inside:avoid;page-break-inside:avoid}
.cell svg{width:var(--qr);height:var(--qr);display:block;margin:0 auto}
.cell .nm{font-size:12px;margin-top:2mm;word-break:break-all}
.cell .pr{font-size:15px;font-weight:bold}
@page{size:A4;margin:10mm}
@media print{
  body{background:#fff}
  header,nav,.noprint{display:none!important}
  main{padding:0;max-width:none}
  section{display:none!important}
  #view-print{display:block!important}
  .card{box-shadow:none;padding:0;margin:0}
  .cell{border:1px dashed #ccc}
}
</style>
</head>
<body>
<header><h1>キッズPOS</h1></header>
<nav class="noprint">
  <button data-v="pos" class="on">レジ</button>
  <button data-v="list">商品リスト</button>
  <button data-v="add">商品とうろく</button>
  <button data-v="print">QRいんさつ</button>
  <button data-v="settings">せってい</button>
</nav>
<main>

<!-- ===== レジ ===== -->
<section id="view-pos" class="on">
  <div class="card">
    <h2>QRコードをよみとる</h2>
    <button class="btn" id="camStart">カメラをはじめる</button>
    <button class="btn sub" id="camStop">とめる</button>
    <video id="video" playsinline muted autoplay></video>
    <div id="scanmsg" class="hint">「カメラをはじめる」をおしてください。</div>
  </div>
  <div class="card">
    <h2>リストからえらぶ</h2>
    <select id="pickItem"></select>
    <button class="btn" id="pickAdd">カゴに入れる</button>
  </div>
  <div class="card">
    <h2>おかいものカゴ</h2>
    <table id="cart"><tbody></tbody></table>
    <p class="total">合計 <span id="sum">0</span> 円</p>
    <label for="paid">あずかったお金（円）</label>
    <input type="number" id="paid" inputmode="numeric" min="0" step="1" placeholder="れい：1000">
    <p class="total">おつり <span id="change">0</span> 円</p>
    <button class="btn" id="checkout">おかいけい</button>
    <button class="btn sub" id="clearCart">カゴをからにする</button>
  </div>
</section>

<!-- ===== 商品リスト ===== -->
<section id="view-list">
  <div class="card">
    <h2>商品リスト（<span id="cnt">0</span>点）</h2>
    <label for="sort">ならびかえ</label>
    <select id="sort">
      <option value="reg">とうろくした順</option>
      <option value="name">名前の順</option>
      <option value="price">ねだんの順</option>
    </select>
    <label><input type="checkbox" id="showThumb"> QRコードを表示する</label>
    <table id="itemTable"><tbody></tbody></table>
  </div>
</section>

<!-- ===== 商品とうろく ===== -->
<section id="view-add">
  <div class="card">
    <h2>商品をとうろくする</h2>
    <label for="nm">商品の名前（20文字まで）</label>
    <input type="text" id="nm" maxlength="20" placeholder="れい：やきそば">
    <label for="pr">ねだん（税込み・円）</label>
    <input type="number" id="pr" inputmode="numeric" min="0" step="1" placeholder="れい：150">
    <button class="btn" id="addItem">とうろくする</button>
    <div id="addmsg"></div>
    <div id="preview" class="thumb" style="margin-top:10px"></div>
    <p class="hint">名前がみじかいほどQRコードのマスが大きくなり、よみとりやすくなります。</p>
  </div>
</section>

<!-- ===== 印刷 ===== -->
<section id="view-print">
  <div class="card noprint">
    <h2>QRコードをいんさつする</h2>
    <p class="hint">A4のふつうの紙に、1商品1枚ずつ印刷されます。</p>
    <button class="btn" id="doPrint">いんさつする</button>
  </div>
  <div class="card"><div class="sheet" id="sheet"></div></div>
</section>

<!-- ===== 設定 ===== -->
<section id="view-settings">
  <div class="card">
    <h2>音のせってい</h2>
    <label for="se">よみとれたときの音</label>
    <select id="se">
      <option value="pi">ピッ</option>
      <option value="pipo">ピポッ</option>
      <option value="pon">ポン</option>
      <option value="charin">チャリン</option>
      <option value="chin">チーン</option>
      <option value="none">なし</option>
    </select>
    <label for="vol">音の大きさ</label>
    <select id="vol"><option value="0.15">小</option><option value="0.35">中</option><option value="0.7">大</option></select>
    <button class="btn sub" id="testSe">音をきいてみる</button>
  </div>
  <div class="card">
    <h2>いんさつのせってい</h2>
    <label for="qrsize">QRコードの大きさ</label>
    <select id="qrsize"><option value="28mm">ふつう（28mm）</option><option value="40mm">大きい（40mm）</option></select>
    <p class="hint">よみとりにくいときは「大きい」にしてください。</p>
  </div>
  <div class="card">
    <h2>データ</h2>
    <button class="btn warn" id="wipe">ぜんぶ消す</button>
    <p class="hint">商品データはこのブラウザの中だけに保存されます。</p>
  </div>
</section>

</main>
<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const KEY_I='kidspos.items', KEY_S='kidspos.settings';
let items=[], settings={se:'pi',vol:'0.35',qrsize:'28mm'};

/* ---------- 保存 ---------- */
function load(){
  try{items=JSON.parse(localStorage.getItem(KEY_I))||[]}catch(e){items=[]}
  try{Object.assign(settings,JSON.parse(localStorage.getItem(KEY_S))||{})}catch(e){}
}
const saveItems=()=>localStorage.setItem(KEY_I,JSON.stringify(items));
const saveSettings=()=>localStorage.setItem(KEY_S,JSON.stringify(settings));

/* ---------- QR生成 ---------- */
qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];
const payload=it=>'KP1|'+it.name+'|'+it.price;
function qrSvg(text){
  const qr=qrcode(0,'M');
  qr.addData(text,'Byte');
  qr.make();
  return qr.createSvgTag({cellSize:2,margin:2,scalable:true});
}
function safeQr(text){
  try{return qrSvg(text)}
  catch(e){return '<span class="err">QRエラー: '+e.message+'</span>'}
}

/* ---------- 音 ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let actx=null;
function ac(){ if(!actx&&AC)actx=new AC(); if(actx&&actx.state==='suspended')actx.resume(); return actx; }
function beep(o){
  const c=ac(); if(!c)return;
  const t=c.currentTime+(o.when||0), dur=o.dur||0.1, tail=o.decay||0;
  const osc=c.createOscillator(), g=c.createGain();
  osc.type=o.type||'square';
  osc.frequency.setValueAtTime(o.freq,t);
  if(o.slideTo)osc.frequency.exponentialRampToValueAtTime(o.slideTo,t+dur);
  const v=Math.max(0.01,(o.gain||1)*parseFloat(settings.vol));
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(v,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur+tail);
  osc.connect(g).connect(c.destination);
  osc.start(t); osc.stop(t+dur+tail+0.05);
}
function playSe(kind){
  switch(kind||settings.se){
    case 'pi': beep({freq:1200,dur:0.09,type:'square'}); break;
    case 'pipo': beep({freq:880,dur:0.07,type:'square'}); beep({freq:1320,dur:0.09,type:'square',when:0.09}); break;
    case 'pon': beep({freq:700,slideTo:330,dur:0.16,type:'sine',gain:1.2}); break;
    case 'charin': beep({freq:2093,dur:0.05,type:'triangle',decay:0.12}); beep({freq:3136,dur:0.05,type:'triangle',when:0.05,decay:0.18}); break;
    case 'chin': beep({freq:1568,dur:0.06,type:'sine',decay:0.8,gain:1.2}); beep({freq:3136,dur:0.05,type:'sine',decay:0.5,gain:0.5}); break;
    default: break;
  }
  try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
}
function errSe(){ beep({freq:220,dur:0.22,type:'sawtooth',gain:0.9}); }

/* ---------- 画面切替 ---------- */

$$('nav button').forEach(b=>b.onclick=()=>{

  $$('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');

  $$('section').forEach(s=>s.classList.remove('on'));
  $('#view-'+b.dataset.v).classList.add('on');
  if(b.dataset.v!=='pos') stopCam();
  if(b.dataset.v==='list') renderList();
  if(b.dataset.v==='print') renderSheet();
  ac();
});

/* ---------- 商品登録 ---------- */
$('#nm').oninput=$('#pr').oninput=()=>{
  const n=$('#nm').value.trim(), p=$('#pr').value;
  $('#preview').innerHTML=(n&&p!=='')?safeQr('KP1|'+n+'|'+parseInt(p,10)):'';
};
$('#addItem').onclick=()=>{
  const n=$('#nm').value.trim(), p=parseInt($('#pr').value,10);
  const msg=$('#addmsg');
  if(!n){msg.innerHTML='<span class="err">名前を入れてください。</span>';return}
  if(n.length>20){msg.innerHTML='<span class="err">名前は20文字までです。</span>';return}
  if(n.includes('|')){msg.innerHTML='<span class="err">「|」は使えません。</span>';return}
  if(!Number.isFinite(p)||p<0){msg.innerHTML='<span class="err">ねだんを正しく入れてください。</span>';return}
  items.push({id:Date.now().toString(36),name:n,price:p});
  saveItems(); refreshPicker();
  msg.innerHTML='<span class="ok">「'+n+'」をとうろくしました。</span>';
  $('#nm').value=''; $('#pr').value=''; $('#preview').innerHTML='';
  playSe();
};

/* ---------- 一覧 ---------- */
function sorted(){
  const a=items.slice();
  if($('#sort').value==='name')a.sort((x,y)=>x.name.localeCompare(y.name,'ja'));
  if($('#sort').value==='price')a.sort((x,y)=>x.price-y.price);
  return a;
}
function renderList(){
  const tb=$('#itemTable tbody'), show=$('#showThumb').checked;
  $('#cnt').textContent=items.length;
  tb.innerHTML='';
  sorted().forEach(it=>{
    const tr=document.createElement('tr');
    tr.innerHTML=(show?'<td class="thumb">'+safeQr(payload(it))+'</td>':'')
      +'<td>'+esc(it.name)+'</td><td class="num">'+it.price+'円</td>'
      +'<td class="num"><button class="mini" data-del="'+it.id+'">けす</button></td>';
    tb.appendChild(tr);
  });
  tb.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const it=items.find(x=>x.id===b.dataset.del);
    if(it&&confirm('「'+it.name+'」をけしますか？')){
      items=items.filter(x=>x.id!==b.dataset.del); saveItems(); renderList(); refreshPicker();
    }
  });
}
$('#sort').onchange=$('#showThumb').onchange=renderList;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 印刷 ---------- */
function renderSheet(){
  document.documentElement.style.setProperty('--qr',settings.qrsize);
  $('#sheet').innerHTML=items.map(it=>
    '<div class="cell">'+safeQr(payload(it))
    +'<div class="nm">'+esc(it.name)+'</div><div class="pr">'+it.price+'円</div></div>').join('');
}
$('#doPrint').onclick=()=>{renderSheet();setTimeout(()=>window.print(),100)};

/* ---------- カメラ＋jsQR ---------- */
let stream=null,timer=null,lastText='',lastAt=0;
const work=document.createElement('canvas');
const wctx=work.getContext('2d',{willReadFrequently:true});
$('#camStart').onclick=async()=>{
  ac();
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    $('#video').srcObject=stream; await $('#video').play();
    $('#scanmsg').textContent='QRコードをうつしてください。';
    clearInterval(timer); timer=setInterval(tick,150);
  }catch(e){ $('#scanmsg').innerHTML='<span class="err">カメラがつかえません（'+e.name+'）</span>'; }
};
$('#camStop').onclick=stopCam;
function stopCam(){
  clearInterval(timer); timer=null;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;$('#video').srcObject=null;
    $('#scanmsg').textContent='カメラをとめました。';}
}
function tick(){
  const v=$('#video'); if(!v.videoWidth)return;
  const sc=Math.min(1,1280/v.videoWidth);
  work.width=Math.round(v.videoWidth*sc); work.height=Math.round(v.videoHeight*sc);
  wctx.drawImage(v,0,0,work.width,work.height);
  const d=wctx.getImageData(0,0,work.width,work.height);
  const r=jsQR(d.data,d.width,d.height,{inversionAttempts:'attemptBoth'});
  if(!r)return;
  const now=Date.now();
  if(r.data===lastText&&now-lastAt<2000)return;
  lastText=r.data; lastAt=now;
  onScan(r.data);
}
function onScan(text){
  const p=text.split('|');
  if(p[0]!=='KP1'||p.length<3){ errSe(); $('#scanmsg').innerHTML='<span class="err">このQRコードはつかえません。</span>'; return; }
  const name=p[1], price=parseInt(p[2],10);
  if(!Number.isFinite(price)){ errSe(); $('#scanmsg').innerHTML='<span class="err">ねだんがよめません。</span>'; return; }
  addCart(name,price); playSe();
  $('#scanmsg').innerHTML='<span class="ok">'+esc(name)+' '+price+'円 をカゴに入れました。</span>';
}

/* ---------- カート ---------- */
let cart=[];
function addCart(name,price){
  const f=cart.find(c=>c.name===name&&c.price===price);
  if(f)f.qty++; else cart.push({name,price,qty:1});
  renderCart();
}
function renderCart(){
  const tb=$('#cart tbody'); tb.innerHTML='';
  cart.forEach((c,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML='<td>'+esc(c.name)+'</td><td class="num">'+c.price+'円</td>'
      +'<td class="num">'+c.qty+'こ</td>'
      +'<td class="num"><button class="mini" data-m="'+i+'">−</button>'
      +'<button class="mini" data-p="'+i+'">＋</button></td>';
    tb.appendChild(tr);
  });
  tb.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{cart[b.dataset.p].qty++;renderCart()});
  tb.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    const i=b.dataset.m; if(--cart[i].qty<=0)cart.splice(i,1); renderCart();
  });
  calc();
}
function calc(){
  const sum=cart.reduce((s,c)=>s+c.price*c.qty,0);
  $('#sum').textContent=sum;
  const paid=parseInt($('#paid').value,10);
  $('#change').textContent=(Number.isFinite(paid)&&paid>=sum)?(paid-sum):0;
}
$('#paid').oninput=calc;
$('#clearCart').onclick=()=>{cart=[];$('#paid').value='';renderCart()};
$('#checkout').onclick=()=>{
  if(!cart.length){errSe();return}
  const sum=cart.reduce((s,c)=>s+c.price*c.qty,0), paid=parseInt($('#paid').value,10);
  if(Number.isFinite(paid)&&paid<sum){errSe();alert('お金がたりません。');return}
  playSe('chin');
  alert('合計 '+sum+'円\nおつり '+(Number.isFinite(paid)?(paid-sum):0)+'円\nありがとうございました！');
  cart=[]; $('#paid').value=''; renderCart();
};
function refreshPicker(){
  $('#pickItem').innerHTML=items.map(it=>'<option value="'+it.id+'">'+esc(it.name)+'（'+it.price+'円）</option>').join('');
}
$('#pickAdd').onclick=()=>{
  const it=items.find(x=>x.id===$('#pickItem').value);
  if(it){addCart(it.name,it.price);playSe()}
};

/* ---------- 設定 ---------- */
$('#se').onchange=()=>{settings.se=$('#se').value;saveSettings();playSe()};
$('#vol').onchange=()=>{settings.vol=$('#vol').value;saveSettings();playSe()};
$('#qrsize').onchange=()=>{settings.qrsize=$('#qrsize').value;saveSettings();renderSheet()};
$('#testSe').onclick=()=>{ac();playSe()};
$('#wipe').onclick=()=>{
  if(confirm('商品データをぜんぶ消します。よろしいですか？')){
    items=[];saveItems();renderList();refreshPicker();renderSheet();
  }
};

/* ---------- 起動 ---------- */
load();
$('#se').value=settings.se; $('#vol').value=settings.vol; $('#qrsize').value=settings.qrsize;
document.documentElement.style.setProperty('--qr',settings.qrsize);
refreshPicker(); renderList(); renderCart();
</script>
</body>
</html>
