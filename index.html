<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex">
<title>Kids POS - おみせやさんレジ</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --main:#2b6cb0; --accent:#dd6b20; --ok:#2f855a; --ng:#c53030;
  --bg:#f7fafc; --line:#cbd5e0; --txt:#1a202c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
  background:var(--bg);color:var(--txt);font-size:17px;line-height:1.5;}
header{background:var(--main);color:#fff;padding:10px 14px;display:flex;
  align-items:center;gap:10px;position:sticky;top:0;z-index:10;}
header h1{font-size:18px;margin:0;flex:1;}
button{font-family:inherit;font-size:17px;border:none;border-radius:10px;
  padding:14px 16px;background:var(--main);color:#fff;cursor:pointer;}
button:active{opacity:.7;}
button.sub{background:#718096;}
button.ok{background:var(--ok);}
button.ng{background:var(--ng);}
button.small{padding:8px 12px;font-size:15px;}
button:disabled{background:#a0aec0;}
.screen{display:none;padding:14px;}
.screen.active{display:block;}
.menu{display:grid;gap:14px;}
.menu button{padding:26px 16px;font-size:20px;font-weight:bold;}
input[type=text],input[type=number]{width:100%;padding:12px;font-size:18px;
  border:2px solid var(--line);border-radius:8px;background:#fff;}
label{display:block;margin:12px 0 4px;font-weight:bold;font-size:15px;}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:12px;margin-bottom:10px;}
.row{display:flex;align-items:center;gap:10px;}
.row .grow{flex:1;min-width:0;}
.note{font-size:13px;color:#4a5568;margin:8px 0;}
.err{color:var(--ng);font-weight:bold;font-size:14px;min-height:20px;}
/* レジ */
#reader{width:100%;border-radius:10px;overflow:hidden;background:#000;}
#reader video{width:100%!important;}
.last{background:#fff;border:2px solid var(--accent);border-radius:10px;
  padding:10px;margin:10px 0;text-align:center;font-size:18px;font-weight:bold;min-height:52px;}
.cart{max-height:34vh;overflow:auto;background:#fff;border:1px solid var(--line);
  border-radius:10px;margin-bottom:10px;}
.cart .item{display:flex;align-items:center;gap:8px;padding:8px 10px;
  border-bottom:1px solid #edf2f7;}
.cart .item:last-child{border-bottom:none;}
.qty{display:flex;align-items:center;gap:6px;}
.qty button{width:36px;height:36px;padding:0;font-size:20px;background:#718096;}
.total{background:#fff;border:3px solid var(--main);border-radius:12px;
  padding:10px;text-align:center;margin-bottom:10px;}
.total .yen{font-size:40px;font-weight:bold;color:var(--main);}
/* 会計 */
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.keypad button{padding:18px 0;font-size:22px;background:#4a5568;}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
.quick button{background:var(--accent);font-size:16px;padding:12px 0;}
.money{background:#fff;border:2px solid var(--line);border-radius:10px;
  padding:10px;margin-top:10px;display:flex;justify-content:space-between;font-size:20px;}
.money b{font-size:28px;}
/* 印刷 */
.preview{overflow:auto;background:#e2e8f0;padding:8px;border-radius:8px;}
.sheet{width:190mm;background:#fff;padding:0;margin:0 auto 10px;
  display:grid;grid-template-columns:repeat(3,63.3mm);
  grid-auto-rows:55mm;page-break-after:always;}
.cell{border:1px dashed #999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2mm;padding:2mm;overflow:hidden;}
.cell canvas{width:25mm!important;height:25mm!important;}
.cell .nm{font-size:11pt;font-weight:bold;text-align:center;line-height:1.2;}
.cell .pr{font-size:14pt;font-weight:bold;}
.cell .tx{font-size:8pt;color:#555;}
@media screen{ .sheet{zoom:.45;} }
@media print{
  body{background:#fff;}
  header,.screen:not(#scr-print),.noprint{display:none!important;}
  #scr-print{padding:0;}
  .preview{overflow:visible;background:none;padding:0;}
  .sheet{zoom:1;margin:0;}
  @page{size:A4 portrait;margin:10mm;}
}
</style>
</head>
<body>

<header>
  <h1 id="title">おみせやさんレジ</h1>
  <button class="small sub noprint" id="btnHome">ホーム</button>
</header>

<!-- ホーム -->
<section class="screen active" id="scr-home">
  <div class="menu">
    <button class="ok" onclick="startRegister()">レジをはじめる</button>
    <button onclick="go('products')">商品を登録する</button>
    <button onclick="go('print')">QRを印刷する</button>
    <button class="sub" onclick="go('settings')">設定</button>
  </div>
  <p class="note">商品を登録してQRコードを印刷し、品物に貼りつけてください。レジ画面でQRコードを読み取ると会計できます。</p>
</section>

<!-- 商品登録 -->
<section class="screen" id="scr-products">
  <div class="card">
    <label for="pName">商品の名前（10文字まで）</label>
    <input type="text" id="pName" maxlength="10" placeholder="りんご">
    <label for="pPrice">ねだん（税込・円）</label>
    <input type="number" id="pPrice" min="0" max="99999" step="1" placeholder="120" inputmode="numeric">
    <p class="err" id="pErr"></p>
    <div class="row">
      <button class="grow ok" id="pSave" onclick="saveProduct()">登録する</button>
      <button class="sub" id="pCancel" style="display:none" onclick="resetForm()">やめる</button>
    </div>
  </div>
  <p class="note">登録した商品：<span id="pCount">0</span> / 30点</p>
  <div id="pList"></div>
</section>

<!-- 印刷 -->
<section class="screen" id="scr-print">
  <div class="noprint">
    <button onclick="window.print()">この内容で印刷する</button>
    <p class="note">A4普通紙・たて向きで印刷してください。印刷ダイアログで「背景のグラフィック」を有効にすると、切り取り線が印刷されます。</p>
  </div>
  <div class="preview" id="printArea"></div>
</section>

<!-- レジ -->
<section class="screen" id="scr-register">
  <div id="reader"></div>
  <div class="last" id="lastScan">QRコードをカメラにうつしてください</div>
  <div class="cart" id="cartList"></div>
  <div class="total">
    <div>合計 <span id="cCount">0</span>点</div>
    <div class="yen"><span id="cTotal">0</span> 円</div>
  </div>
  <div class="row">
    <button class="grow sub small" onclick="openManual()">一覧から選ぶ</button>
    <button class="grow sub small" onclick="clearCart()">全部消す</button>
    <button class="grow ok" id="btnPay" onclick="goCheckout()" disabled>お会計</button>
  </div>
  <div id="manual" style="display:none;margin-top:10px"></div>
</section>

<!-- 会計 -->
<section class="screen" id="scr-checkout">
  <div class="total">
    <div>お会計</div>
    <div class="yen"><span id="kTotal">0</span> 円</div>
  </div>
  <div class="money"><span>おあずかり</span><b id="kRecv">0</b></div>
  <div class="money"><span>おつり</span><b id="kChange" style="color:var(--accent)">0</b></div>
  <p class="err" id="kErr"></p>
  <div class="quick">
    <button onclick="addRecv(100)">100円</button>
    <button onclick="addRecv(500)">500円</button>
    <button onclick="addRecv(1000)">1000円</button>
    <button onclick="addRecv(5000)">5000円</button>
    <button onclick="addRecv(10000)">10000円</button>
    <button onclick="justRecv()">ちょうど</button>
  </div>
  <div class="keypad">
    <button onclick="keyIn('1')">1</button><button onclick="keyIn('2')">2</button><button onclick="keyIn('3')">3</button>
    <button onclick="keyIn('4')">4</button><button onclick="keyIn('5')">5</button><button onclick="keyIn('6')">6</button>
    <button onclick="keyIn('7')">7</button><button onclick="keyIn('8')">8</button><button onclick="keyIn('9')">9</button>
    <button onclick="keyIn('0')">0</button><button onclick="keyIn('00')">00</button><button class="ng" onclick="clearRecv()">C</button>
  </div>
  <div class="row" style="margin-top:12px">
    <button class="grow sub" onclick="go('register');resumeScan()">もどる</button>
    <button class="grow ok" id="btnDone" onclick="finish()" disabled>会計をおわる</button>
  </div>
</section>

<!-- 設定 -->
<section class="screen" id="scr-settings">
  <div class="card">
    <div class="row"><span class="grow">こうかおん</span>
      <button class="small" id="swSound" onclick="toggle('sound')">ON</button></div>
  </div>
  <div class="card">
    <div class="row"><span class="grow">バイブレーション</span>
      <button class="small" id="swVib" onclick="toggle('vibration')">ON</button></div>
    <p class="note">iPhoneではバイブレーションは動作しません（iOSの仕様）。</p>
  </div>
  <div class="card">
    <button class="ng" onclick="wipe()">登録した商品をすべて消す</button>
  </div>
</section>

<script>
/* ===== 定数・状態 ===== */
const KEY_P='kidspos.products', KEY_S='kidspos.settings';
const MAX_ITEMS=30, DUP_MS=2000, PER_PAGE=15;
let products=[], settings={sound:true,vibration:true};
let cart=[], editId=null, scanner=null, scanning=false;
let lastCode='', lastTime=0, recv=0;

/* ===== 保存・読込 ===== */
function load(){
  try{products=JSON.parse(localStorage.getItem(KEY_P))||[];}catch(e){products=[];}
  try{settings=Object.assign(settings,JSON.parse(localStorage.getItem(KEY_S))||{});}catch(e){}
}
function saveP(){localStorage.setItem(KEY_P,JSON.stringify(products));}
function saveS(){localStorage.setItem(KEY_S,JSON.stringify(settings));}

/* ===== 画面遷移 ===== */
const TITLES={home:'おみせやさんレジ',products:'商品の登録',print:'QRコードの印刷',
  register:'レジ',checkout:'お会計',settings:'設定'};
function go(name){
  if(name!=='register'&&scanning) stopScan();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('scr-'+name).classList.add('active');
  document.getElementById('title').textContent=TITLES[name];
  window.scrollTo(0,0);
  if(name==='products') renderProducts();
  if(name==='print') renderPrint();
  if(name==='settings') renderSettings();
}
document.getElementById('btnHome').onclick=()=>{go('home');};

/* ===== 商品登録 ===== */
function saveProduct(){
  const err=document.getElementById('pErr');
  const name=document.getElementById('pName').value.trim();
  const price=parseInt(document.getElementById('pPrice').value,10);
  err.textContent='';
  if(!name){err.textContent='商品の名前を入力してください';return;}
  if(name.includes('|')){err.textContent='「|」は使えません';return;}
  if(name.length>10){err.textContent='名前は10文字までです';return;}
  if(!Number.isFinite(price)||price<0||price>99999){err.textContent='ねだんは0〜99999の数字で入力してください';return;}
  if(editId===null){
    if(products.length>=MAX_ITEMS){err.textContent='商品は30点までです';return;}
    products.push({id:Date.now().toString(36),name:name,price:price});
  }else{
    const p=products.find(x=>x.id===editId);
    if(p){p.name=name;p.price=price;}
  }
  saveP();resetForm();renderProducts();
}
function resetForm(){
  editId=null;
  document.getElementById('pName').value='';
  document.getElementById('pPrice').value='';
  document.getElementById('pErr').textContent='';
  document.getElementById('pSave').textContent='登録する';
  document.getElementById('pCancel').style.display='none';
}
function editProduct(id){
  const p=products.find(x=>x.id===id); if(!p)return;
  editId=id;
  document.getElementById('pName').value=p.name;
  document.getElementById('pPrice').value=p.price;
  document.getElementById('pSave').textContent='変更する';
  document.getElementById('pCancel').style.display='block';
  window.scrollTo(0,0);
}
function delProduct(id){
  const p=products.find(x=>x.id===id); if(!p)return;
  if(!confirm('「'+p.name+'」を消しますか？'))return;
  products=products.filter(x=>x.id!==id);saveP();resetForm();renderProducts();
}
function payload(p){return 'KP1|'+p.name+'|'+p.price;}

function renderProducts(){
  document.getElementById('pCount').textContent=products.length;
  const box=document.getElementById('pList'); box.innerHTML='';
  if(!products.length){box.innerHTML='<p class="note">まだ商品がありません。</p>';return;}
  products.forEach(p=>{
    const d=document.createElement('div'); d.className='card row';
    const cv=document.createElement('canvas'); cv.width=64;cv.height=64;
    QRCode.toCanvas(cv,payload(p),{errorCorrectionLevel:'M',margin:1,width:64},()=>{});
    const info=document.createElement('div'); info.className='grow';
    info.innerHTML='<div style="font-weight:bold">'+esc(p.name)+'</div><div>'+p.price+' 円（税込）</div>';
    const b1=document.createElement('button'); b1.className='small sub'; b1.textContent='編集';
    b1.onclick=()=>editProduct(p.id);
    const b2=document.createElement('button'); b2.className='small ng'; b2.textContent='削除';
    b2.onclick=()=>delProduct(p.id);
    d.append(cv,info,b1,b2); box.appendChild(d);
  });
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ===== 印刷 ===== */
function renderPrint(){
  const area=document.getElementById('printArea'); area.innerHTML='';
  if(!products.length){area.innerHTML='<p class="note">商品を登録してください。</p>';return;}
  for(let i=0;i<products.length;i+=PER_PAGE){
    const sheet=document.createElement('div'); sheet.className='sheet';
    products.slice(i,i+PER_PAGE).forEach(p=>{
      const c=document.createElement('div'); c.className='cell';
      const cv=document.createElement('canvas');
      QRCode.toCanvas(cv,payload(p),{errorCorrectionLevel:'M',margin:1,width:300},()=>{});
      const nm=document.createElement('div'); nm.className='nm'; nm.textContent=p.name;
      const pr=document.createElement('div'); pr.className='pr'; pr.textContent='¥'+p.price;
      const tx=document.createElement('div'); tx.className='tx'; tx.textContent='税込';
      c.append(cv,nm,pr,tx); sheet.appendChild(c);
    });
    area.appendChild(sheet);
  }
}

/* ===== フィードバック ===== */
let actx=null;
function initAudio(){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
  }catch(e){}
}
function beep(ok){
  if(settings.vibration&&navigator.vibrate) navigator.vibrate(ok?40:[60,50,60]);
  if(!settings.sound||!actx) return;
  try{
    const o=actx.createOscillator(),g=actx.createGain();
    o.type='sine'; o.frequency.value=ok?1200:300;
    g.gain.setValueAtTime(.15,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+(ok?.12:.3));
    o.connect(g);g.connect(actx.destination);
    o.start();o.stop(actx.currentTime+(ok?.13:.31));
  }catch(e){}
}

/* ===== レジ・スキャン ===== */
function startRegister(){
  initAudio(); go('register'); startScan();
}
function startScan(){
  if(scanning) return;
  if(!scanner) scanner=new Html5Qrcode('reader',{verbose:false});
  const box=v=>{const m=Math.floor(Math.min(v.width,v.height)*0.7);return{width:m,height:m};};
  scanner.start({facingMode:{ideal:'environment'}},{fps:10,qrbox:box},onScan,()=>{})
    .then(()=>{scanning=true;})
    .catch(e=>{
      document.getElementById('lastScan').innerHTML=
        '<span style="color:#c53030">カメラを起動できませんでした。<br>Safariの設定でカメラを許可してください。</span>';
    });
}
function stopScan(){
  if(scanner&&scanning){scanner.stop().then(()=>{scanner.clear();scanning=false;}).catch(()=>{scanning=false;});}
}
function resumeScan(){if(!scanning) startScan();}

function onScan(text){
  const now=Date.now();
  if(text===lastCode&&now-lastTime<DUP_MS) return;
  lastCode=text; lastTime=now;
  const item=parsePayload(text);
  const box=document.getElementById('lastScan');
  if(!item){
    beep(false);
    box.innerHTML='<span style="color:#c53030">このQRコードは使えません</span>';
    return;
  }
  addToCart(item.name,item.price);
  beep(true);
  box.innerHTML=esc(item.name)+'　'+item.price+'円';
}
function parsePayload(t){
  const a=String(t).split('|');
  if(a.length!==3||a[0]!=='KP1') return null;
  const price=parseInt(a[1+1],10);
  if(!Number.isFinite(price)||price<0) return null;
  return {name:a[1],price:price};
}

/* ===== カート ===== */
function addToCart(name,price){
  const f=cart.find(x=>x.name===name&&x.price===price);
  if(f) f.qty++; else cart.push({name:name,price:price,qty:1});
  renderCart();
}
function changeQty(i,d){
  cart[i].qty+=d;
  if(cart[i].qty<=0) cart.splice(i,1);
  renderCart();
}
function clearCart(){
  if(cart.length&&!confirm('カートを全部消しますか？'))return;
  cart=[];lastCode='';renderCart();
  document.getElementById('lastScan').textContent='QRコードをカメラにうつしてください';
}
function total(){return cart.reduce((s,x)=>s+x.price*x.qty,0);}
function count(){return cart.reduce((s,x)=>s+x.qty,0);}
function renderCart(){
  const box=document.getElementById('cartList'); box.innerHTML='';
  cart.forEach((x,i)=>{
    const d=document.createElement('div'); d.className='item';
    const n=document.createElement('div'); n.className='grow';
    n.innerHTML='<b>'+esc(x.name)+'</b><br><small>'+x.price+'円 × '+x.qty+' = '+(x.price*x.qty)+'円</small>';
    const q=document.createElement('div'); q.className='qty';
    const m=document.createElement('button'); m.textContent='−'; m.onclick=()=>changeQty(i,-1);
    const p=document.createElement('button'); p.textContent='＋'; p.onclick=()=>changeQty(i,1);
    q.append(m,p); d.append(n,q); box.appendChild(d);
  });
  document.getElementById('cTotal').textContent=total();
  document.getElementById('cCount').textContent=count();
  document.getElementById('btnPay').disabled=cart.length===0;
}
function openManual(){
  const box=document.getElementById('manual');
  if(box.style.display==='block'){box.style.display='none';return;}
  box.innerHTML=''; box.style.display='block';
  if(!products.length){box.innerHTML='<p class="note">商品が登録されていません。</p>';return;}
  products.forEach(p=>{
    const b=document.createElement('button');
    b.className='small'; b.style.margin='4px';
    b.textContent=p.name+' '+p.price+'円';
    b.onclick=()=>{addToCart(p.name,p.price);beep(true);};
    box.appendChild(b);
  });
}

/* ===== 会計 ===== */
function goCheckout(){
  stopScan(); recv=0; go('checkout'); renderPay();
}
function keyIn(s){
  const t=String(recv)+s;
  if(t.length>7) return;
  recv=parseInt(t,10)||0; renderPay();
}
function addRecv(v){recv+=v;renderPay();}
function justRecv(){recv=total();renderPay();}
function clearRecv(){recv=0;renderPay();}
function renderPay(){
  const t=total(), c=recv-t;
  document.getElementById('kTotal').textContent=t;
  document.getElementById('kRecv').textContent=recv;
  document.getElementById('kChange').textContent=c>=0?c:0;
  document.getElementById('kErr').textContent=c<0?'お金が足りません':'';
  document.getElementById('btnDone').disabled=(c<0);
}
function finish(){
  beep(true);
  alert('ありがとうございました！\nおつりは '+(recv-total())+' 円です。');
  cart=[];recv=0;lastCode='';renderCart();
  document.getElementById('lastScan').textContent='QRコードをカメラにうつしてください';
  go('register'); startScan();
}

/* ===== 設定 ===== */
function renderSettings(){
  document.getElementById('swSound').textContent=settings.sound?'ON':'OFF';
  document.getElementById('swSound').className='small'+(settings.sound?'':' sub');
  document.getElementById('swVib').textContent=settings.vibration?'ON':'OFF';
  document.getElementById('swVib').className='small'+(settings.vibration?'':' sub');
}
function toggle(k){settings[k]=!settings[k];saveS();renderSettings();if(settings[k])beep(true);}
function wipe(){
  if(!confirm('登録した商品をすべて消します。よろしいですか？'))return;
  products=[];saveP();renderProducts();alert('消しました');
}

/* ===== 初期化 ===== */
load(); renderCart(); renderSettings();
document.addEventListener('visibilitychange',()=>{if(document.hidden) stopScan();});
</script>
</body>
</html>
