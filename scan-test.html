<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<title>スキャン診断</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  body{font-family:-apple-system,sans-serif;margin:12px;line-height:1.6}
  button{font-size:16px;padding:10px 16px;margin:4px 4px 4px 0;border-radius:8px;border:1px solid #888;background:#f5f5f5}
  video,canvas,img{width:100%;max-width:480px;background:#000;border-radius:8px;display:block}
  #log{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px;background:#111;color:#0f0;padding:8px;border-radius:8px;min-height:8em}
  .ok{color:#0a0;font-weight:bold}.ng{color:#c00;font-weight:bold}
  h2{font-size:16px;margin:16px 0 4px}
</style>
</head>
<body>
<h1 style="font-size:18px">スキャン診断ツール</h1>

<h2>1. ライブ読み取り</h2>
<button id="start">カメラ開始</button>
<button id="stop">停止</button>
<button id="snap">今のフレームを静止画表示</button>
<video id="v" playsinline muted autoplay></video>
<div id="stat"></div>

<h2>2. 静止フレーム（ピント確認用）</h2>
<canvas id="shot"></canvas>

<h2>3. 写真を撮って読み取り（代替方式）</h2>
<input type="file" accept="image/*" capture="environment" id="file">
<img id="photo" alt="">

<h2>ログ</h2>
<div id="log"></div>

<script>
const $=id=>document.getElementById(id);
const log=(s)=>{$('log').textContent=(new Date()).toLocaleTimeString()+' '+s+'\n'+$('log').textContent;};
let stream=null, timer=null, frames=0, decoded=0;
const work=document.createElement('canvas');
const wctx=work.getContext('2d',{willReadFrequently:true});

$('start').onclick=async()=>{
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    $('v').srcObject=stream; await $('v').play();
    const t=stream.getVideoTracks()[0], s=t.getSettings();
    log('camera OK / label='+t.label+' / '+s.width+'x'+s.height+' / fps='+(s.frameRate||'?'));
    frames=0; decoded=0;
    clearInterval(timer); timer=setInterval(tick,150);
  }catch(e){ log('getUserMedia NG: '+e.name+' / '+e.message); }
};
$('stop').onclick=()=>{clearInterval(timer); if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;} log('stopped');};

function grab(){
  const v=$('v');
  if(!v.videoWidth) return null;
  const scale=Math.min(1,1280/v.videoWidth);
  work.width=Math.round(v.videoWidth*scale); work.height=Math.round(v.videoHeight*scale);
  wctx.drawImage(v,0,0,work.width,work.height);
  return wctx.getImageData(0,0,work.width,work.height);
}
function brightness(d){let s=0;for(let i=0;i<d.data.length;i+=4*37){s+=d.data[i];}return (s/(d.data.length/(4*37))).toFixed(1);}

function tick(){
  const img=grab(); if(!img){$('stat').textContent='videoWidth=0（映像未取得）';return;}
  frames++;
  const r=jsQR(img.data,img.width,img.height,{inversionAttempts:'attemptBoth'});
  if(r){decoded++; log('DECODE OK: '+r.data);}
  $('stat').innerHTML='frame '+frames+' / '+img.width+'x'+img.height
    +' / 平均輝度 '+brightness(img)
    +' / 成功 '+(decoded?'<span class=ok>'+decoded+'</span>':'<span class=ng>0</span>');
}

$('snap').onclick=()=>{
  const img=grab(); if(!img){log('snap: フレーム取得不可');return;}
  const c=$('shot'); c.width=img.width; c.height=img.height;
  c.getContext('2d').putImageData(img,0,0);
  log('snap: '+img.width+'x'+img.height+' 平均輝度='+brightness(img));
};

$('file').onchange=async(e)=>{
  const f=e.target.files[0]; if(!f) return;
  const url=URL.createObjectURL(f); $('photo').src=url;
  const im=new Image(); im.onload=()=>{
    const sc=Math.min(1,1600/im.width);
    work.width=Math.round(im.width*sc); work.height=Math.round(im.height*sc);
    wctx.drawImage(im,0,0,work.width,work.height);
    const d=wctx.getImageData(0,0,work.width,work.height);
    const r=jsQR(d.data,d.width,d.height,{inversionAttempts:'attemptBoth'});
    log('photo '+d.width+'x'+d.height+' 輝度='+brightness(d)+' → '+(r?('DECODE OK: '+r.data):'DECODE 失敗'));
    URL.revokeObjectURL(url);
  };
  im.src=url;
};
log('UA: '+navigator.userAgent);
</script>
</body>
</html>
