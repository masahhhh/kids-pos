<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Kids POS</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --line:#d8dee6; --txt:#1b2430;
  --pri:#0b6bcb; --pri-d:#08549f; --ok:#1c8c4a; --ng:#c0392b; --mut:#67727f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  background:var(--bg); color:var(--txt); font-size:16px; line-height:1.6;
  padding-bottom:env(safe-area-inset-bottom);
}
#appbar{
  position:sticky; top:0; z-index:50; background:var(--pri); color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  display:flex; align-items:center; gap:10px;
}
#appbar h1{font-size:17px;margin:0;flex:1}
#btn-back{
  background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:8px;
  padding:6px 12px; font-size:14px;
}
main{padding:12px; max-width:720px; margin:0 auto}
section{display:none}
section.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
button{font-family:inherit;font-size:16px;cursor:pointer}
.btn{
  display:block;width:100%;padding:14px;border:0;border-radius:12px;
  background:var(--pri);color:#fff;font-weight:700;margin-bottom:10px;
}
.btn:active{background:var(--pri-d)}
.btn.sub{background:#e8edf3;color:var(--txt)}
.btn.ok{background:var(--ok)}
.btn.ng{background:var(--ng)}
.btn.sm{width:auto;padding:8px 14px;font-size:14px;margin:0;border-radius:8px}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px;font-weight:700}
input[type=text],input[type=number]{
  width:100%;padding:12px;font-size:16px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--txt)
}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.count{font-size:13px;color:var(--mut);text-align:right}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mut);font-weight:700}
td.num,th.num{text-align:right;white-space:nowrap}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:24px 0}

/* ===== カメラプレビュー（正方形） ===== */
#reader{
  width:100%; aspect-ratio:1/1; max-height:70vh;
  border-radius:10px; overflow:hidden; background:#000; position:relative;
}
#reader video{
  position:absolute; top:0; left:0;
  width:100%!important; height:100%!important;
  object-fit:cover; display:block;
}
#reader::after{
  content:""; position:absolute; pointer-events:none;
  top:15%; left:15%; width:70%; height:70%;
  border:3px solid rgba(255,255,255,.75); border-radius:12px;
}
#reader::before{
  content:""; position:absolute; pointer-events:none;
  top:30%; left:4%; width:92%; height:40%;
  border:2px dashed rgba(255,220,0,.85); border-radius:6px;
}
#reader.hide-guide::after,#reader.hide-guide::before{display:none}
#scan-status{font-size:12px;color:var(--mut);margin-top:6px;min-height:1.4em}

/* ===== 会計 ===== */
.total{font-size:32px;font-weight:800;text-align:right}
.change{font-size:28px;font-weight:800;text-align:right;color:var(--ok)}
.change.minus{color:var(--ng)}

/* ===== モーダル（native confirm を使わない＝カメラ凍結対策） ===== */
#modal{
  position:fixed; inset:0; z-index:100; display:none;
  background:rgba(0,0,0,.45); align-items:center; justify-content:center; padding:20px;
}
#modal.show{display:flex}
#modal .box{background:#fff;border-radius:14px;padding:18px;max-width:340px;width:100%}
#modal p{margin:0 0 14px;white-space:pre-wrap}
#toast{
  position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
  background:rgba(20,26,34,.92); color:#fff; padding:10px 16px; border-radius:20px;
  font-size:14px; z-index:120; opacity:0; transition:opacity .2s; pointer-events:none;
  max-width:88vw; text-align:center;
}
#toast.show{opacity:1}

/* ===== 印刷 ===== */
#labels{display:flex;flex-wrap:wrap;gap:6mm}
.label{
  border:1px dashed #999; border-radius:4px; padding:3mm;
  text-align:center; background:#fff; page-break-inside:avoid; break-inside:avoid;
}
.label img{display:block;margin:0 auto;image-rendering:pixelated}
.label .nm{font-size:11pt;font-weight:700;margin-top:2mm;word-break:break-all}
.label .pr{font-size:13pt;font-weight:800}
@media print{
  #appbar,.noprint{display:none!important}
  body{background:#fff;padding:0}
  main{padding:0;max-width:none}
  .card{border:0;padding:0;margin:0}
  .label{border:1px dashed #bbb}
}
</style>
</head>
<body>

<header id="appbar">
  <button id="btn-back" type="button" style="visibility:hidden">戻る</button>
  <h1 id="title">Kids POS</h1>
</header>

<main>

  <!-- ========== ホーム ========== -->
  <section id="scr-home" class="active">
    <button class="btn" data-go="scr-cart">レジをはじめる</button>
    <button class="btn sub" data-go="scr-products">商品をとうろく</button>
    <button class="btn sub" data-go="scr-print">QRコードを印刷</button>
    <button class="btn sub" data-go="scr-data">データの保存・読みこみ</button>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <span>とうろく済み商品</span>
        <strong><span id="home-count">0</span> / <span class="max-items">50</span> 点</strong>
      </div>
    </div>
  </section>

  <!-- ========== 商品一覧 ========== -->
  <section id="scr-products">
    <button class="btn" id="btn-new">＋ あたらしく登録する</button>
    <div class="count"><span id="prod-count">0</span> / <span class="max-items">50</span> 点</div>
    <div class="card">
      <table>
        <thead><tr>
          <th>商品名</th><th class="num">価格</th><th>バーコード</th><th class="num"></th>
        </tr></thead>
        <tbody id="prod-body"></tbody>
      </table>
      <div id="prod-empty" class="empty">まだ商品がありません</div>
    </div>
  </section>

  <!-- ========== 商品編集 ========== -->
  <section id="scr-edit">
    <div class="card">
      <label for="inp-name">商品名（<span class="max-name">20</span>文字まで）</label>
      <input id="inp-name" type="text" maxlength="20" placeholder="りんご">

      <label for="inp-price">ねだん（0〜99999円）</label>
      <input id="inp-price" type="number" inputmode="numeric" min="0" max="99999" step="1" placeholder="120">

      <label for="inp-code">バーコード（にゅうりょくしなくてもOK）</label>
      <div class="row">
        <input id="inp-code" type="text" inputmode="numeric" maxlength="14" placeholder="スキャン / 手入力">
        <button class="btn sm" id="btn-scan-code" type="button">読取</button>
      </div>
      <div class="hint">数字8〜14桁（JAN／EAN／UPC など）。おなじコードは登録できません。</div>
    </div>
    <button class="btn ok" id="btn-save">保存する</button>
    <button class="btn ng" id="btn-delete" style="display:none">この商品を削除</button>
  </section>

  <!-- ========== 印刷プレビュー ========== -->
  <section id="scr-print">
    <div class="card noprint">
      <label>QRコードの大きさ</label>
      <div class="grid2">
        <button class="btn sm qrsize" data-size="28" style="width:100%">28mm</button>
        <button class="btn sm qrsize" data-size="40" style="width:100%">40mm</button>
      </div>
      <div class="hint" id="qrsize-now"></div>
      <button class="btn" id="btn-print" style="margin-top:12px">印刷する</button>
    </div>
    <div class="card">
      <div id="labels"></div>
      <div id="print-empty" class="empty">商品を登録すると、ここにQRコードが出ます</div>
    </div>
  </section>

  <!-- ========== レジ ========== -->
  <section id="scr-cart">
    <div class="card">
      <div id="reader-host-cart"></div>
      <div id="scan-status">カメラは停止中です</div>
      <div class="grid2" style="margin-top:8px">
        <button class="btn sm" id="btn-cam" style="width:100%">カメラを開始</button>
        <button class="btn sm sub" id="btn-manual" style="width:100%">手入力で追加</button>
      </div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>商品</th><th class="num">たんか</th><th class="num">数</th><th class="num"></th></tr></thead>
        <tbody id="cart-body"></tbody>
      </table>
      <div id="cart-empty" class="empty">まだ何もありません</div>
      <div class="total" style="margin-top:10px">合計 <span id="cart-total">0</span> 円</div>
    </div>
    <button class="btn ok" id="btn-pay">おかいけい</button>
    <button class="btn ng" id="btn-clear">全部消す</button>
  </section>

  <!-- ========== 会計 ========== -->
  <section id="scr-pay">
    <div class="card">
      <div class="total">おあいそ <span id="pay-total">0</span> 円</div>
      <label for="inp-recv">あずかったお金</label>
      <input id="inp-recv" type="number" inputmode="numeric" min="0" step="1" placeholder="0">
      <div class="grid2" style="margin-top:8px">
        <button class="btn sm sub recv" data-add="100" style="width:100%">+100</button>
        <button class="btn sm sub recv" data-add="500" style="width:100%">+500</button>
        <button class="btn sm sub recv" data-add="1000" style="width:100%">+1000</button>
        <button class="btn sm sub recv" data-add="5000" style="width:100%">+5000</button>
      </div>
      <div class="change" id="pay-change" style="margin-top:14px">おつり 0 円</div>
    </div>
    <button class="btn ok" id="btn-done">かんりょう</button>
    <button class="btn sub" id="btn-pay-back">レジにもどる</button>
  </section>

  <!-- ========== データ ========== -->
  <section id="scr-data">
    <div class="card">
      <strong>書き出し</strong>
      <div class="hint">とうろくした商品を、ファイルまたは文字にして保存します。</div>
      <button class="btn" id="btn-export-file" style="margin-top:10px">ファイルに保存</button>
      <button class="btn sub" id="btn-export-copy">文字をコピー</button>
    </div>
    <div class="card">
      <strong>読みこみ</strong>
      <div class="hint">読みこむと、いまの商品は<b>すべて置きかわります</b>。</div>
      <input type="file" id="inp-file" accept="application/json,.json" style="margin-top:10px">
      <label for="inp-json">または、コピーした文字をはりつけ</label>
      <textarea id="inp-json" rows="5" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px"></textarea>
      <button class="btn sub" id="btn-import-text" style="margin-top:8px">この文字から読みこむ</button>
    </div>
  </section>

</main>

<!-- スキャナ本体（画面間で使い回す） -->
<div id="reader" style="display:none"></div>

<div id="modal"><div class="box">
  <p id="modal-msg"></p>
  <div class="grid2">
    <button class="btn sm sub" id="modal-no" style="width:100%">キャンセル</button>
    <button class="btn sm ng" id="modal-yes" style="width:100%">OK</button>
  </div>
</div></div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode_UTF8.js"></script>
<script>
'use strict';

/* ============================================================
   定数
   ============================================================ */
const MAX_ITEMS = 50;
const MAX_NAME  = 20;
const MAX_PRICE = 99999;
const CODE_RE   = /^[0-9]{8,14}$/;
const NAME_NG   = /[|\r\n\t]/;
const SCAN_SIDE = 480;      // デコード用内部解像度（正方形の一辺）
const SCAN_MS   = 150;      // スキャン間隔
const STALL_LIMIT = 20;     // 150ms×20 = 3秒フレーム停止で再接続
const LS_P = 'kidspos.products';
const LS_S = 'kidspos.settings';

/* ============================================================
   状態
   ============================================================ */
let products = [];              // {name, price, code}
let settings = { qrSize: 28 };
let cart     = [];              // {name, price, qty}
let editIndex = -1;
let scanMode  = 'cart';         // 'cart' | 'register'

/* ============================================================
   ユーティリティ
   ============================================================ */
const $  = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const yen = (n) => Number(n).toLocaleString('ja-JP');

let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// native confirm は iOS でカメラを凍結させるため自前モーダルを使う
function confirmBox(msg){
  return new Promise((resolve) => {
    const m = $('#modal');
    $('#modal-msg').textContent = msg;
    m.classList.add('show');
    const done = (v) => {
      m.classList.remove('show');
      $('#modal-yes').removeEventListener('click', yes);
      $('#modal-no').removeEventListener('click', no);
      resolve(v);
      setTimeout(resumeVideo, 60);   // 閉じた直後に映像を復帰
    };
    const yes = () => done(true);
    const no  = () => done(false);
    $('#modal-yes').addEventListener('click', yes);
    $('#modal-no').addEventListener('click', no);
  });
}

/* ============================================================
   永続化
   ============================================================ */
function loadAll(){
  try{
    const p = JSON.parse(localStorage.getItem(LS_P) || '[]');
    if (Array.isArray(p)) products = p.map(sanitize).filter(Boolean).slice(0, MAX_ITEMS);
  }catch(e){ products = []; }
  try{
    const s = JSON.parse(localStorage.getItem(LS_S) || '{}');
    if (s && (s.qrSize === 28 || s.qrSize === 40)) settings.qrSize = s.qrSize;
  }catch(e){ /* 既定値のまま */ }
}
function saveProducts(){ localStorage.setItem(LS_P, JSON.stringify(products)); }
function saveSettings(){ localStorage.setItem(LS_S, JSON.stringify(settings)); }

function sanitize(p){
  if (!p || typeof p.name !== 'string') return null;
  const name = p.name.replace(NAME_NG, '').slice(0, MAX_NAME).trim();
  if (!name) return null;
  let price = parseInt(p.price, 10);
  if (!Number.isFinite(price) || price < 0) price = 0;
  if (price > MAX_PRICE) price = MAX_PRICE;
  const code = (typeof p.code === 'string' && CODE_RE.test(p.code)) ? p.code : '';
  return { name, price, code };
}

/* ============================================================
   サウンド（Web Audio / iOS 対策）
   ============================================================ */
let ac = null;
async function unlockAudio(){
  try{
    if (!ac){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
    }
    if (ac.state === 'suspended') await ac.resume();
    // 無音バッファでハード的にアンロック
    const b = ac.createBuffer(1, 1, 22050);
    const s = ac.createBufferSource();
    s.buffer = b; s.connect(ac.destination); s.start(0);
    // カメラ使用時に出力が通話系に切り替わるのを防ぐ（対応ブラウザのみ）
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
  }catch(e){ /* 音は無くても業務は継続 */ }
}
function tone(freq, dur, delay){
  if (!ac || ac.state !== 'running') return;
  const t0 = ac.currentTime + (delay || 0);
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const beepOk   = () => { tone(1660, 0.09, 0); };
const beepNg   = () => { tone(220, 0.18, 0); tone(180, 0.22, 0.16); };
const beepDone = () => { tone(880,0.1,0); tone(1174,0.1,0.11); tone(1568,0.18,0.22); };

/* ============================================================
   画面遷移
   ============================================================ */
const TITLES = {
  'scr-home':'Kids POS', 'scr-products':'商品リスト', 'scr-edit':'商品のとうろく',
  'scr-print':'QRコード印刷', 'scr-cart':'レジ', 'scr-pay':'おかいけい', 'scr-data':'データ'
};
let backTo = null;

function showScreen(id){
  if (id !== 'scr-cart' && id !== 'scr-edit') stopScan();
  $$('section').forEach(s => s.classList.toggle('active', s.id === id));
  $('#title').textContent = TITLES[id] || 'Kids POS';
  $('#btn-back').style.visibility = (id === 'scr-home') ? 'hidden' : 'visible';
  backTo = (id === 'scr-home') ? null
        : (id === 'scr-edit') ? 'scr-products'
        : (id === 'scr-pay')  ? 'scr-cart' : 'scr-home';
  window.scrollTo(0, 0);
  if (id === 'scr-products') renderProducts();
  if (id === 'scr-print')    renderLabels();
  if (id === 'scr-cart')     renderCart();
  if (id === 'scr-home')     $('#home-count').textContent = products.length;
}

/* ============================================================
   商品一覧
   ============================================================ */
function renderProducts(){
  const tb = $('#prod-body');
  tb.innerHTML = products.map((p, i) => `
    <tr>
      <td>${esc(p.name)}</td>
      <td class="num">${yen(p.price)}円</td>
      <td class="code">${p.code ? esc(p.code) : '—'}</td>
      <td class="num"><button class="btn sm sub" data-edit="${i}">編集</button></td>
    </tr>`).join('');
  $('#prod-empty').style.display = products.length ? 'none' : '';
  $('#prod-count').textContent = products.length;
  $('#home-count').textContent = products.length;
}

function openEdit(index){
  editIndex = index;
  const p = (index >= 0) ? products[index] : { name:'', price:'', code:'' };
  $('#inp-name').value  = p.name;
  $('#inp-price').value = p.price;
  $('#inp-code').value  = p.code;
  $('#btn-delete').style.display = (index >= 0) ? '' : 'none';
  showScreen('scr-edit');
}

function validateProduct(name, price, code, idx){
  if (!name) return '商品名をいれてください';
  if (name.length > MAX_NAME) return `商品名は${MAX_NAME}文字までです`;
  if (NAME_NG.test(name)) return '商品名に使えない記号（| 改行）があります';
  if (!Number.isInteger(price) || price < 0 || price > MAX_PRICE)
    return `ねだんは0〜${MAX_PRICE}の整数でいれてください`;
  if (code){
    if (!CODE_RE.test(code)) return 'バーコードは数字8〜14桁です';
    const d = products.findIndex((p, i) => p.code === code && i !== idx);
    if (d >= 0) return `そのバーコードは「${products[d].name}」に登録ずみです`;
  }
  if (idx < 0 && products.length >= MAX_ITEMS) return `商品は${MAX_ITEMS}点までです`;
  return null;
}

function saveEdit(){
  const name  = $('#inp-name').value.trim();
  const price = parseInt($('#inp-price').value, 10);
  const code  = $('#inp-code').value.trim();
  const err = validateProduct(name, price, code, editIndex);
  if (err){ beepNg(); toast(err); return; }
  const rec = { name, price, code };
  if (editIndex >= 0) products[editIndex] = rec; else products.push(rec);
  saveProducts(); beepOk(); toast('保存しました');
  showScreen('scr-products');
}

async function deleteEdit(){
  if (editIndex < 0) return;
  const ok = await confirmBox(`「${products[editIndex].name}」を削除します。よろしいですか？`);
  if (!ok) return;
  products.splice(editIndex, 1);
  saveProducts(); toast('削除しました');
  showScreen('scr-products');
}

/* ============================================================
   QRラベル（印刷）
   ============================================================ */
function qrPayload(p){ return `KP1|${p.name}|${p.price}`; }

function makeQrDataUrl(text){
  try{
    if (window.qrcode && qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs['UTF-8']){
      qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
    }
    const qr = qrcode(0, 'M');        // 0 = 型番自動
    qr.addData(text, 'Byte');
    qr.make();
    return qr.createDataURL(8, 2);    // セル8px / マージン2セル
  }catch(e){ return null; }
}

function renderLabels(){
  const mm = settings.qrSize;
  $('#qrsize-now').textContent = `いまの大きさ：${mm}mm`;
  $$('.qrsize').forEach(b => {
    const on = Number(b.dataset.size) === mm;
    b.classList.toggle('sub', !on);
  });
  const host = $('#labels');
  host.innerHTML = products.map(p => {
    const url = makeQrDataUrl(qrPayload(p));
    const img = url ? `<img src="${url}" style="width:${mm}mm;height:${mm}mm" alt="">`
                    : `<div style="width:${mm}mm;height:${mm}mm;background:#eee"></div>`;
    return `<div class="label" style="width:${mm + 12}mm">
      ${img}<div class="nm">${esc(p.name)}</div><div class="pr">${yen(p.price)}円</div></div>`;
  }).join('');
  $('#print-empty').style.display = products.length ? 'none' : '';
}

/* ============================================================
   カート
   ============================================================ */
function addToCart(name, price){
  const hit = cart.find(c => c.name === name && c.price === price);
  if (hit) hit.qty++; else cart.push({ name, price, qty:1 });
  renderCart();
}
function cartTotal(){ return cart.reduce((s, c) => s + c.price * c.qty, 0); }

function renderCart(){
  $('#cart-body').innerHTML = cart.map((c, i) => `
    <tr>
      <td>${esc(c.name)}</td>
      <td class="num">${yen(c.price)}</td>
      <td class="num">${c.qty}</td>
      <td class="num"><button class="btn sm sub" data-del="${i}">－</button></td>
    </tr>`).join('');
  $('#cart-empty').style.display = cart.length ? 'none' : '';
  $('#cart-total').textContent = yen(cartTotal());
}

function addByCode(code){
  const p = products.find(x => x.code === code);
  if (!p){ beepNg(); toast('とうろくされていないバーコードです'); return; }
  addToCart(p.name, p.price); beepOk();
  toast(`${p.name} ${yen(p.price)}円`);
}

function addFromQrPayload(text){
  const parts = text.split('|');
  if (parts.length < 3){ beepNg(); toast('QRコードが読めませんでした'); return; }
  const name = parts[1].slice(0, MAX_NAME);
  const price = parseInt(parts[2], 10);
  if (!name || !Number.isFinite(price) || price < 0 || price > MAX_PRICE){
    beepNg(); toast('QRコードの中身がおかしいです'); return;
  }
  addToCart(name, price); beepOk();
  toast(`${name} ${yen(price)}円`);
}

/* ============================================================
   デコーダ（QR = jsQR / 1D = ZXing）
   ============================================================ */
let zxReader = null;
function initZXing(){
  if (zxReader) return zxReader;
  if (!window.ZXing || !ZXing.MultiFormatReader) return null;
  try{
    const F = ZXing.BarcodeFormat, H = ZXing.DecodeHintType;
    const hints = new Map();
    hints.set(H.POSSIBLE_FORMATS,
      [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF]);
    hints.set(H.TRY_HARDER, true);
    zxReader = new ZXing.MultiFormatReader();
    zxReader.setHints(hints);
    return zxReader;
  }catch(e){ return null; }
}

// RGBA -> 輝度（ZXing の RGBLuminanceSource は輝度配列を要求する）
function toLuminance(d, w, h){
  const out = new Uint8ClampedArray(w * h);
  for (let i = 0, j = 0; i < out.length; i++, j += 4){
    out[i] = (d[j] * 306 + d[j + 1] * 601 + d[j + 2] * 117) >> 10;
  }
  return out;
}

function decode1D(imageData){
  const r = initZXing();
  if (!r) return null;
  try{
    const src = new ZXing.RGBLuminanceSource(
      toLuminance(imageData.data, imageData.width, imageData.height),
      imageData.width, imageData.height);
    const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));
    const res = r.decode(bmp);
    return res ? res.getText() : null;
  }catch(e){
    return null;                 // NotFoundException は正常系
  }finally{
    try{ r.reset(); }catch(e){}
  }
}

/* ============================================================
   スキャナ
   ============================================================ */
let stream = null, video = null, canvas = null, ctx = null;
let scanRunning = false, scanTimer = null, scanFrame = 0;
let lastVideoTime = -1, stallCount = 0;
let lastText = '', lastAt = 0;

function setStatus(t){ $('#scan-status').textContent = t; }

function ensureVideo(){
  if (video) return video;
  video = document.createElement('video');
  video.setAttribute('playsinline', '');
  video.setAttribute('webkit-playsinline', '');
  video.setAttribute('muted', '');
  video.muted = true;
  video.autoplay = true;
  $('#reader').appendChild(video);
  canvas = document.createElement('canvas');
  ctx = canvas.getContext('2d', { willReadFrequently:true });
  return video;
}

async function startScan(hostSel, mode){
  await unlockAudio();
  scanMode = mode;
  const host = $(hostSel);
  const reader = $('#reader');
  reader.style.display = '';
  reader.classList.toggle('hide-guide', false);
  host.appendChild(reader);
  ensureVideo();

  if (scanRunning){ resumeVideo(); return; }
  setStatus('カメラを起動しています…');
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ ideal:'environment' },
        width:{ ideal:1280 }, height:{ ideal:1280 }
      }
    });
  }catch(e){
    setStatus('カメラを使えません：' + (e && e.name ? e.name : 'エラー'));
    toast('カメラの許可を確認してください');
    return;
  }
  video.srcObject = stream;
  try{ await video.play(); }catch(e){ /* 後段の resumeVideo で復帰 */ }
  await unlockAudio();            // カメラ起動でセッションが切替わるため再度
  scanRunning = true;
  stallCount = 0; lastVideoTime = -1;
  setStatus('よみとり中…（QR＝白わく／バーコード＝黄色わく）');
  scheduleNext();
}

function scheduleNext(){
  clearTimeout(scanTimer);
  if (scanRunning) scanTimer = setTimeout(scanTick, SCAN_MS);
}

function stopScan(){
  scanRunning = false;
  clearTimeout(scanTimer);
  if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (video) video.srcObject = null;
  $('#reader').style.display = 'none';
  document.body.appendChild($('#reader'));
  setStatus('カメラは停止中です');
  const b = $('#btn-cam'); if (b) b.textContent = 'カメラを開始';
}

function resumeVideo(){
  if (!scanRunning || !video) return;
  if (video.paused){ video.play().catch(() => {}); }
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
  scheduleNext();
}

async function restartCamera(){
  setStatus('カメラを再接続しています…');
  const host = $('#reader').parentElement;
  const mode = scanMode;
  stopScan();
  await new Promise(r => setTimeout(r, 400));
  await startScan('#' + host.id, mode);
}

function scanTick(){
  if (!scanRunning){ return; }
  if (!video || video.readyState < 2){ scheduleNext(); return; }

  // フレーム停止検知（3秒進まなければ再接続）
  if (video.currentTime === lastVideoTime){
    if (++stallCount >= STALL_LIMIT){ stallCount = 0; restartCamera(); return; }
  }else{
    lastVideoTime = video.currentTime; stallCount = 0;
  }

  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh){ scheduleNext(); return; }

  // プレビュー（object-fit:cover）と同じ中央正方形を切り出す
  const side = Math.min(vw, vh);
  const sx = (vw - side) / 2, sy = (vh - side) / 2;
  canvas.width = SCAN_SIDE; canvas.height = SCAN_SIDE;
  ctx.drawImage(video, sx, sy, side, side, 0, 0, SCAN_SIDE, SCAN_SIDE);

  let text = null;

  // (A) QR：正方形の全域
  try{
    const full = ctx.getImageData(0, 0, SCAN_SIDE, SCAN_SIDE);
    const qr = jsQR(full.data, full.width, full.height, { inversionAttempts:'dontInvert' });
    if (qr && qr.data) text = qr.data;
  }catch(e){ /* 描画前フレームは無視 */ }

  // (B) 1D：横長の帯だけ。2フレームに1回（負荷対策）
  if (!text && (scanFrame++ % 2 === 0)){
    try{
      const y = Math.floor(SCAN_SIDE * 0.30), h = Math.floor(SCAN_SIDE * 0.40);
      text = decode1D(ctx.getImageData(0, y, SCAN_SIDE, h));
    }catch(e){ /* 同上 */ }
  }

  if (text) handleDecoded(text);
  scheduleNext();
}

function handleDecoded(text){
  const now = Date.now();
  if (text === lastText && now - lastAt < 1500) return;   // 連続読み防止
  lastText = text; lastAt = now;

  if (scanMode === 'register'){
    if (!CODE_RE.test(text)){ beepNg(); toast('バーコード（数字8〜14桁）ではありません'); return; }
    $('#inp-code').value = text;
    beepOk(); stopScan(); showScreen('scr-edit');
    toast('バーコードを読みとりました');
    return;
  }
  if (text.startsWith('KP1|'))      addFromQrPayload(text);
  else if (CODE_RE.test(text))      addByCode(text);
  else { beepNg(); toast('対応していないコードです'); }
}

/* ============================================================
   データ入出力
   ============================================================ */
function exportObject(){
  return {
    app:'kidspos', format:2,
    exportedAt:new Date().toISOString(),
    products: products.map(p => ({ name:p.name, price:p.price, code:p.code }))
  };
}

function exportFile(){
  const blob = new Blob([JSON.stringify(exportObject(), null, 2)],
    { type:'application/json' });
  const a = document.createElement('a');
  const d = new Date();
  const p2 = (n) => String(n).padStart(2, '0');
  a.href = URL.createObjectURL(blob);
  a.download = `kidspos-${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('ファイルを保存しました');
}

async function exportCopy(){
  const txt = JSON.stringify(exportObject());
  try{
    await navigator.clipboard.writeText(txt);
    toast('コピーしました');
  }catch(e){
    $('#inp-json').value = txt;
    toast('コピーできないので下の欄に出しました');
  }
}

function normalizeImported(json){
  if (!json || json.app !== 'kidspos') throw new Error('Kids POS のデータではありません');
  if (json.format !== 1 && json.format !== 2) throw new Error('対応していない形式です');
  if (!Array.isArray(json.products)) throw new Error('商品データがありません');
  const seen = new Set();
  const out = [];
  for (const raw of json.products){
    if (out.length >= MAX_ITEMS) break;
    const p = sanitize(raw);
    if (!p) continue;
    if (json.format === 1) p.code = '';
    if (p.code){
      if (seen.has(p.code)) p.code = ''; else seen.add(p.code);
    }
    out.push(p);
  }
  if (!out.length) throw new Error('読みこめる商品がありませんでした');
  return out;
}

async function importFromText(txt){
  let list;
  try{ list = normalizeImported(JSON.parse(txt)); }
  catch(e){ beepNg(); toast('読みこめません：' + e.message); return; }
  const ok = await confirmBox(
    `${list.length}点を読みこみます。\nいまの${products.length}点はすべて置きかわります。`);
  if (!ok) return;
  products = list; saveProducts(); beepOk();
  toast(`${list.length}点を読みこみました`);
  showScreen('scr-products');
}

/* ============================================================
   イベント登録
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  loadAll();
  $$('.max-items').forEach(e => e.textContent = MAX_ITEMS);
  $$('.max-name').forEach(e => e.textContent = MAX_NAME);
  $('#inp-name').maxLength = MAX_NAME;
  $('#inp-price').max = MAX_PRICE;

  // 最初のタップで音声をアンロック
  const once = () => { unlockAudio(); document.removeEventListener('touchend', once);
                       document.removeEventListener('click', once); };
  document.addEventListener('touchend', once, { passive:true });
  document.addEventListener('click', once);

  $$('[data-go]').forEach(b => b.addEventListener('click', () => showScreen(b.dataset.go)));
  $('#btn-back').addEventListener('click', () => showScreen(backTo || 'scr-home'));

  // --- 商品 ---
  $('#btn-new').addEventListener('click', () => {
    if (products.length >= MAX_ITEMS){ beepNg(); toast(`商品は${MAX_ITEMS}点までです`); return; }
    openEdit(-1);
  });
  $('#prod-body').addEventListener('click', (e) => {
    const b = e.target.closest('[data-edit]');
    if (b) openEdit(Number(b.dataset.edit));
  });
  $('#btn-save').addEventListener('click', saveEdit);
  $('#btn-delete').addEventListener('click', deleteEdit);
  $('#btn-scan-code').addEventListener('click', () => {
    startScan('#reader-host-cart', 'register');
    showScreen('scr-cart');
    setStatus('バーコードをよみとってください（登録用）');
  });

  // --- 印刷 ---
  $$('.qrsize').forEach(b => b.addEventListener('click', () => {
    settings.qrSize = Number(b.dataset.size); saveSettings(); renderLabels();
  }));
  $('#btn-print').addEventListener('click', () => window.print());

  // --- レジ ---
  $('#btn-cam').addEventListener('click', () => {
    if (scanRunning){ stopScan(); }
    else { startScan('#reader-host-cart', 'cart'); $('#btn-cam').textContent = 'カメラを停止'; }
  });
  $('#btn-manual').addEventListener('click', () => {
    if (!products.length){ toast('先に商品をとうろくしてください'); return; }
    const names = products.map((p, i) => `${i + 1}. ${p.name} ${p.price}円`).join('\n');
    const s = window.prompt('番号をいれてください\n' + names, '');
    const i = parseInt(s, 10) - 1;
    if (Number.isInteger(i) && products[i]){ addToCart(products[i].name, products[i].price); beepOk(); }
    setTimeout(resumeVideo, 60);
  });
  $('#cart-body').addEventListener('click', (e) => {
    const b = e.target.closest('[data-del]');
    if (!b) return;
    const i = Number(b.dataset.del);
    if (cart[i]){ cart[i].qty--; if (cart[i].qty <= 0) cart.splice(i, 1); renderCart(); }
  });
  $('#btn-clear').addEventListener('click', async () => {
    if (!cart.length) return;
    const ok = await confirmBox('カートを全部消します。よろしいですか？');
    if (ok){ cart = []; renderCart(); toast('全部消しました'); }
    resumeVideo();
  });
  $('#btn-pay').addEventListener('click', () => {
    if (!cart.length){ beepNg(); toast('カートがからっぽです'); return; }
    stopScan();
    $('#pay-total').textContent = yen(cartTotal());
    $('#inp-recv').value = '';
    updateChange();
    showScreen('scr-pay');
  });

  // --- 会計 ---
  function updateChange(){
    const total = cartTotal();
    const recv = parseInt($('#inp-recv').value, 10);
    const el = $('#pay-change');
    if (!Number.isFinite(recv)){ el.textContent = 'おつり 0 円'; el.classList.remove('minus'); return; }
    const ch = recv - total;
    el.textContent = (ch >= 0) ? `おつり ${yen(ch)} 円` : `あと ${yen(-ch)} 円たりません`;
    el.classList.toggle('minus', ch < 0);
  }
  window.updateChange = updateChange;
  $('#inp-recv').addEventListener('input', updateChange);
  $$('.recv').forEach(b => b.addEventListener('click', () => {
    const cur = parseInt($('#inp-recv').value, 10) || 0;
    $('#inp-recv').value = cur + Number(b.dataset.add);
    updateChange();
  }));
  $('#btn-pay-back').addEventListener('click', () => showScreen('scr-cart'));
  $('#btn-done').addEventListener('click', () => {
    const recv = parseInt($('#inp-recv').value, 10);
    if (Number.isFinite(recv) && recv < cartTotal()){ beepNg(); toast('お金がたりません'); return; }
    beepDone(); cart = []; renderCart();
    toast('ありがとうございました！');
    showScreen('scr-cart');
  });

  // --- データ ---
  $('#btn-export-file').addEventListener('click', exportFile);
  $('#btn-export-copy').addEventListener('click', exportCopy);
  $('#btn-import-text').addEventListener('click', () => {
    const t = $('#inp-json').value.trim();
    if (!t){ toast('文字をはりつけてください'); return; }
    importFromText(t);
  });
  $('#inp-file').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { importFromText(String(r.result)); e.target.value = ''; };
    r.onerror = () => { toast('ファイルを読めませんでした'); };
    r.readAsText(f);
  });

  // --- 復帰系 ---
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') setTimeout(resumeVideo, 120);
  });
  window.addEventListener('pageshow', () => setTimeout(resumeVideo, 120));
  window.addEventListener('focus', () => setTimeout(resumeVideo, 120));

  showScreen('scr-home');
});
</script>
